# Incident risk-score weights (master plan §8.5).
#
# THESE WEIGHTS ARE HAND-SET. They were chosen by judgement and sanity-checked against the label
# distribution on the validation split. They are NOT learned, and must never be described as
# learned — §12.3 lists exactly that question as one a judge is expected to ask.
#
# Every component is normalised to [0, 1] by app/policies/risk.py *before* these weights are
# applied. Without that, a raw correlated-alert count of 12 silently dominates a confidence of
# 0.85 and the weights below mean nothing.
#
# Weights sum to 1.0, so the resulting score is itself in [0, 1] and comparable across incidents.

weights:
  severity: 0.22            # detector-assigned suspicion and verdict
  model_confidence: 0.24    # baseline classifier P(TruePositive)
  asset_criticality: 0.13   # how much the affected asset matters
  user_privilege: 0.12      # privilege held by the affected account
  correlated_alerts: 0.12   # breadth of corroborating signal
  threat_intel: 0.10        # named threat family / known-bad indicator
  sla_urgency: 0.07         # how long the incident has been waiting

# Saturation points for log-scaled counts. An incident with 40 alerts is not four times as urgent
# as one with 10, so counts saturate rather than scale linearly.
saturation:
  alert_count: 8
  evidence_count: 30
  entity_count: 20

# Hours after which an untriaged incident is treated as maximally urgent.
sla_hours: 24
